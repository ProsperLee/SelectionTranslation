<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具箱 — 原型</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      font-family: "Microsoft YaHei UI", sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      overflow: hidden;
    }

    .window {
      display: flex;
      flex-direction: column;
      width: min(1100px, 100vw - 32px);
      height: min(700px, 100vh - 32px);
      margin: 16px auto;
      background: #212121;
      border: 1px solid #373737;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .window.is-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      border-radius: 0;
      border: none;
      z-index: 100;
    }

    .win-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      height: 36px;
      padding: 0 8px;
      flex-shrink: 0;
      border-bottom: 1px solid #2a2a2a;
      user-select: none;
    }

    .win-header-left,
    .win-header-right {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .win-header-right {
      justify-content: flex-end;
    }

    .win-title {
      color: #ffffff;
      font-size: 14px;
      line-height: 1;
      white-space: nowrap;
    }

    .icon-btn {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .icon-btn:hover {
      background: #3a3a3a;
    }

    .icon-btn:active {
      background: #454545;
    }

    .icon-btn img {
      width: 12px;
      height: 12px;
      display: block;
      filter: brightness(0) invert(0.91);
    }

    .icon-btn:hover img {
      filter: brightness(0) invert(1);
    }

    .body {
      flex: 1;
      min-height: 0;
      display: flex;
      background: #1e1e1e;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      border-right: 1px solid #373737;
      overflow-y: auto;
      padding: 8px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 36px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #c8c8c8;
      font: inherit;
      font-size: 13px;
      text-align: left;
      padding: 0 12px;
      cursor: pointer;
      line-height: 1;
    }

    .menu-item img {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: block;
      filter: brightness(0) invert(0.72);
    }

    .menu-item:hover {
      background: #2a2a2a;
      color: #ffffff;
    }

    .menu-item:hover img {
      filter: brightness(0) invert(1);
    }

    .menu-item.is-active {
      background: #2f2f2f;
      color: #ffffff;
    }

    .menu-item.is-active img {
      filter: brightness(0) saturate(100%) invert(48%) sepia(98%) saturate(1800%) hue-rotate(191deg) brightness(102%) contrast(101%);
    }

    .menu-item + .menu-item {
      margin-top: 2px;
    }

    .main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .main-header {
      flex-shrink: 0;
      height: 40px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #373737;
    }

    .main-header-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: block;
      filter: brightness(0) saturate(100%) invert(48%) sepia(98%) saturate(1800%) hue-rotate(191deg) brightness(102%) contrast(101%);
    }

    .main-title {
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
    }

    .main-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      color: #d0d0d0;
      font-size: 13px;
      line-height: 1.6;
    }

    .sidebar,
    .main-content {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
    }

    .sidebar::-webkit-scrollbar,
    .main-content::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-thumb,
    .main-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
    }

    .panel {
      display: none;
    }

    .panel.is-active {
      display: block;
    }

    /* —— 工具通用 —— */
    .tool-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 0;
      min-height: 32px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: stretch;
    }

    @media (max-width: 720px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .field-label {
      color: #a0a0a0;
      font-size: 12px;
      line-height: 1;
      min-height: 12px;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1a1a1a;
      color: #e8e8e8;
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: #088fff;
    }

    .textarea {
      resize: vertical;
      min-height: 140px;
      font-family: Consolas, "Courier New", monospace;
      line-height: 1.5;
    }

    .btn {
      height: 32px;
      padding: 0 14px;
      border: none;
      border-radius: 6px;
      background: #088fff;
      color: #fff;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .btn:hover {
      background: #0078e6;
    }

    .btn:active {
      background: #006acc;
    }

    .btn.ghost {
      background: #2f2f2f;
      color: #e8e8e8;
    }

    .btn.ghost:hover {
      background: #3a3a3a;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hint {
      color: #888;
      font-size: 12px;
    }

    .status {
      font-size: 12px;
      color: #888;
      min-height: 18px;
      line-height: 18px;
      flex: 1;
      min-width: 0;
    }

    .status.ok {
      color: #6dce8b;
    }

    .status.err {
      color: #ff6b6b;
    }

    .dropzone {
      border: 1px dashed #454545;
      border-radius: 6px;
      background: #1a1a1a;
      min-height: 180px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      cursor: pointer;
      text-align: center;
      color: #999;
    }

    .dropzone:hover,
    .dropzone.is-drag {
      border-color: #088fff;
      color: #ccc;
    }

    .preview {
      max-width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 4px;
      background: #111;
    }

    .preview-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      height: 100%;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1a1a1a;
      padding: 12px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #c8c8c8;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .check input {
      accent-color: #088fff;
    }

    .qr-page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      min-height: min(480px, calc(100vh - 200px));
      height: 100%;
      align-items: stretch;
    }

    .qr-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .qr-left .qr-text {
      flex: 1;
      min-height: 220px;
      resize: none;
    }

    .qr-left-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .qr-left-actions .status {
      flex: 1;
      text-align: left;
    }

    .qr-right {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      min-height: 0;
    }

    .qr-preview-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .qr-summary {
      color: #888;
      font-size: 12px;
      text-align: center;
      line-height: 1.4;
      min-height: 18px;
    }

    .qr-settings {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .qr-setting-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: center;
      gap: 10px;
    }

    .qr-setting-row.is-hidden {
      display: none !important;
    }

    .qr-setting-row > .field-label {
      text-align: right;
      color: #9a9a9a;
    }

    .qr-setting-row .select,
    .qr-setting-row .input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
    }

    .qr-size-custom {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qr-size-custom .input {
      flex: 1;
      max-width: 140px;
    }

    .qr-size-custom .unit {
      color: #888;
      font-size: 13px;
    }

    .qr-settings .select:disabled,
    .qr-settings .input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .qr-preview-card .preview-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 220px;
      min-height: 180px;
      flex: none;
      overflow: hidden;
    }

    .qr-preview-card .preview-wrap .hint {
      margin: 0;
      text-align: center;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .qr-preview-card .preview-wrap .hint[hidden] {
      display: none !important;
    }

    .qr-preview-card .preview-wrap canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .qr-preview-card .preview-wrap canvas[hidden] {
      display: none !important;
    }

    .preview-wrap canvas {
      max-width: calc(100% - 16px);
      max-height: calc(100% - 16px);
      background: #fff;
      border-radius: 4px;
      display: block;
    }

    .preview-wrap canvas[hidden] {
      display: none !important;
    }

    @media (max-width: 720px) {
      .qr-page {
        grid-template-columns: 1fr;
        height: auto;
      }

      .qr-left .qr-text {
        min-height: 140px;
      }
    }

    .hl {
      background: rgba(8, 143, 255, 0.35);
      border-radius: 2px;
      padding: 0 1px;
    }

    /* 正则 */
    .re-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 100%;
    }

    .re-panel > .field {
      gap: 10px;
    }

    .re-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
    }

    .re-panel .field-label {
      color: #9a9a9a;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.2;
      min-height: 0;
    }

    .btn-copy {
      height: 28px;
      padding: 0 8px;
      gap: 5px;
      display: inline-flex;
      align-items: center;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #9a9a9a;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #e0e0e0;
    }

    .btn-copy img {
      width: 13px;
      height: 13px;
      filter: brightness(0) invert(0.6);
      display: block;
    }

    .btn-copy:hover img {
      filter: brightness(0) invert(0.88);
    }

    .re-pattern-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .re-slash {
      color: #6e6e6e;
      font-family: Consolas, "Courier New", monospace;
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      flex-shrink: 0;
      user-select: none;
    }

    .re-flags-suffix {
      flex-shrink: 0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 15px;
      line-height: 1;
      user-select: none;
      white-space: nowrap;
      min-width: 2.5em;
    }

    .re-flags-suffix .slash {
      color: #6e6e6e;
    }

    .re-flags-suffix .flags {
      color: #7ec8a0;
      letter-spacing: 0.5px;
    }

    .re-pattern-row .input {
      flex: 1;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #2c2c2c;
      border-radius: 6px;
      background: #141414;
      color: #e8e8e8;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
    }

    .re-pattern-row .input::placeholder {
      color: #555;
    }

    .re-pattern-row .input:focus {
      border-color: #3d8f63;
      box-shadow: 0 0 0 1px rgba(61, 143, 99, 0.25);
    }

    .re-flags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 18px;
      align-items: center;
      padding: 2px 0 0;
      border: none;
      border-radius: 0;
      background: transparent;
    }

    .re-flags .check {
      color: #b5b5b5;
      font-size: 13px;
      gap: 6px;
      padding: 0;
      border-radius: 0;
    }

    .re-flags .check:hover {
      background: transparent;
      color: #e0e0e0;
    }

    .re-flags .check input {
      width: 14px;
      height: 14px;
      accent-color: #3d8f63;
      cursor: pointer;
    }

    .re-flag-key {
      color: #c8c8c8;
      font-family: Consolas, "Courier New", monospace;
      font-weight: 600;
      margin-right: 2px;
    }

    .re-editor {
      display: flex;
      border: 1px solid #2c2c2c;
      border-radius: 6px;
      background: #141414;
      overflow: hidden;
      height: 140px;
      min-height: 100px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .re-editor:focus-within {
      border-color: #3d8f63;
      box-shadow: 0 0 0 1px rgba(61, 143, 99, 0.25);
    }

    .re-linenums {
      flex-shrink: 0;
      width: 40px;
      height: 100%;
      padding: 12px 0;
      text-align: center;
      color: #555;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.65;
      border-right: 1px solid #242424;
      background: #101010;
      user-select: none;
      overflow: hidden;
      white-space: pre;
      box-sizing: border-box;
    }

    .re-editor .textarea {
      flex: 1;
      height: 100%;
      min-height: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      resize: none;
      padding: 12px 14px;
      line-height: 1.65;
      font-size: 13px;
      overflow: auto;
      color: #e0e0e0;
    }

    .re-editor .textarea::placeholder {
      color: #555;
    }

    .re-editor .textarea:focus {
      outline: none;
      box-shadow: none;
      border-color: transparent;
    }

    .re-result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 24px;
    }

    .re-count {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 10px;
      border-radius: 999px;
      background: #222;
      border: 1px solid #2f2f2f;
      color: #888;
      font-size: 12px;
      line-height: 1;
    }

    .re-count.has-match {
      color: #7ec8a0;
      border-color: rgba(61, 143, 99, 0.45);
      background: rgba(61, 143, 99, 0.12);
    }

    .re-result-box {
      border: 1px solid #2c2c2c;
      border-radius: 6px;
      background: #141414;
      min-height: 72px;
      max-height: 160px;
      overflow: auto;
      padding: 12px 14px;
    }

    .re-highlight {
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.7;
      color: #c8c8c8;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .re-highlight .mk {
      color: #7ec8a0;
      font-weight: 600;
    }

    .re-result-empty {
      color: #555;
      font-size: 13px;
      text-align: left;
      padding: 8px 0;
    }

    .re-result-err {
      color: #ff6b6b;
      font-size: 13px;
      padding: 4px 0;
    }

    .re-detail-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
      padding: 0;
    }

    .re-detail-item {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      background: #1a1a1a;
      font-size: 13px;
    }

    .re-detail-item .idx {
      color: #777;
      font-family: Consolas, "Courier New", monospace;
    }

    .re-detail-item .val {
      color: #7ec8a0;
      font-family: Consolas, "Courier New", monospace;
      word-break: break-all;
    }

    .re-detail-item .pos {
      color: #777;
      font-size: 12px;
      white-space: nowrap;
    }

    .re-detail-empty {
      color: #555;
      font-size: 13px;
      padding: 4px 0;
    }

    .hidden-file {
      display: none;
    }

    .split-v {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-card {
      border: 1px solid #333;
      border-radius: 6px;
      background: #191919;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-card-title {
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      min-height: 20px;
    }

    .tool-card-title .sub {
      color: #888;
      font-weight: 400;
      font-size: 12px;
      margin: 0;
    }

    .seg {
      display: inline-flex;
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
    }

    .seg label {
      display: inline-flex;
      align-items: center;
      gap: 0;
      cursor: pointer;
      user-select: none;
    }

    .seg input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .seg span {
      padding: 6px 12px;
      font-size: 12px;
      color: #b0b0b0;
      background: #1a1a1a;
      border-right: 1px solid #333;
    }

    .seg label:last-child span {
      border-right: none;
    }

    .seg input:checked + span {
      background: #088fff;
      color: #fff;
    }

    .textarea.sm {
      min-height: 0;
      flex: 1;
    }

    /* 图片 → 编码：左右标签同行对齐，左侧上传跨两行输出 */
    .encode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto 1fr;
      gap: 8px 12px;
      align-items: stretch;
      min-height: 280px;
    }

    .encode-grid .lab-img {
      grid-column: 1;
      grid-row: 1;
    }

    .encode-grid .lab-pure {
      grid-column: 2;
      grid-row: 1;
    }

    .encode-grid .drop-cell {
      grid-column: 1;
      grid-row: 2 / 5;
      min-height: 0;
      display: flex;
    }

    .encode-grid .out-pure {
      grid-column: 2;
      grid-row: 2;
      min-height: 0;
      width: 100%;
      height: 100%;
      resize: none;
    }

    .encode-grid .lab-data {
      grid-column: 2;
      grid-row: 3;
    }

    .encode-grid .out-data {
      grid-column: 2;
      grid-row: 4;
      min-height: 0;
      width: 100%;
      height: 100%;
      resize: none;
    }

    /* 解码 → 图片 */
    .io-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 8px 12px;
      align-items: stretch;
      min-height: 260px;
    }

    .io-grid > .field-label {
      grid-row: 1;
    }

    .io-grid > .field-label:nth-child(1) {
      grid-column: 1;
    }

    .io-grid > .field-label:nth-child(2) {
      grid-column: 2;
    }

    .io-box {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .io-box.left {
      grid-column: 1;
      grid-row: 2;
    }

    .io-box.right {
      grid-column: 2;
      grid-row: 2;
    }

    .dropzone,
    .preview-wrap {
      flex: 1;
      min-height: 220px;
      height: 100%;
      width: 100%;
    }

    .preview-wrap {
      position: relative;
    }

    .preview-dl {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 2;
    }

    .preview-dl.is-visible {
      display: inline-flex;
    }

    .preview-dl:hover {
      background: rgba(0, 0, 0, 0.75);
    }

    .preview-dl img {
      width: 14px;
      height: 14px;
      filter: brightness(0) invert(1);
      display: block;
    }

    .decode-input {
      flex: 1;
      min-height: 220px;
      height: 100%;
      resize: none;
    }

    @media (max-width: 720px) {
      .encode-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto auto auto;
        min-height: 0;
      }

      .encode-grid .lab-img { grid-column: 1; grid-row: 1; }
      .encode-grid .drop-cell { grid-column: 1; grid-row: 2; min-height: 180px; }
      .encode-grid .lab-pure { grid-column: 1; grid-row: 3; }
      .encode-grid .out-pure { grid-column: 1; grid-row: 4; min-height: 100px; }
      .encode-grid .lab-data { grid-column: 1; grid-row: 5; }
      .encode-grid .out-data { grid-column: 1; grid-row: 6; min-height: 100px; }

      .io-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto;
        min-height: 0;
      }

      .io-grid > .field-label:nth-child(1) {
        grid-column: 1;
        grid-row: 1;
      }

      .io-grid > .field-label:nth-child(2) {
        grid-column: 1;
        grid-row: 3;
      }

      .io-box.left {
        grid-column: 1;
        grid-row: 2;
      }

      .io-box.right {
        grid-column: 1;
        grid-row: 4;
      }
    }
  </style>
</head>

<body>
  <div class="window" id="win">
    <div class="win-header">
      <div class="win-header-left"></div>
      <div class="win-title">工具箱</div>
      <div class="win-header-right">
        <button class="icon-btn" id="btnMin" type="button" title="最小化">
          <img src="../icons/minus.svg" alt="" />
        </button>
        <button class="icon-btn" id="btnFs" type="button" title="全屏">
          <img id="fsIcon" src="../icons/restore.svg" alt="" />
        </button>
        <button class="icon-btn" id="btnClose" type="button" title="关闭">
          <img src="../icons/close.svg" alt="" />
        </button>
      </div>
    </div>

    <div class="body">
      <aside class="sidebar" id="menu" aria-label="菜单区域">
        <button class="menu-item is-active" type="button" data-id="img-base64" data-icon="../icons/image.svg">
          <img src="../icons/image.svg" alt="" />
          <span>图片-Base64</span>
        </button>
        <button class="menu-item" type="button" data-id="qrcode" data-icon="../icons/qrcode.svg">
          <img src="../icons/qrcode.svg" alt="" />
          <span>二维码生成</span>
        </button>
        <button class="menu-item" type="button" data-id="regex" data-icon="../icons/regex.svg">
          <img src="../icons/regex.svg" alt="" />
          <span>正则表达式</span>
        </button>
      </aside>

      <section class="main">
        <header class="main-header">
          <img class="main-header-icon" id="mainIcon" src="../icons/image.svg" alt="" />
          <div class="main-title" id="mainTitle">图片-Base64</div>
        </header>
        <div class="main-content" id="mainContent">

          <!-- 图片 ↔ Base64：编码 / 解码分开 -->
          <div class="panel is-active" data-id="img-base64">
            <div class="split-v">
              <!-- ① 图片 → 编码 -->
              <div class="tool-card">
                <div class="tool-card-title">
                  图片 → 编码
                  <span class="status" id="encodeStatus" style="margin-left:auto;flex:0 1 auto;text-align:right"></span>
                </div>
                <div class="encode-grid">
                  <div class="field-label lab-img">选择图片</div>
                  <div class="field-label lab-pure">Base64 编码（纯数据）</div>
                  <div class="drop-cell">
                    <div class="dropzone" id="imgDrop" tabindex="0">
                      <span class="dz-hint">拖拽 / 粘贴图片到此处，或点击选择文件</span>
                      <span class="hint dz-sub">支持 PNG / JPG / GIF / WebP / SVG</span>
                      <img class="preview" id="imgPreview" alt="" hidden />
                    </div>
                    <input class="hidden-file" id="imgFile" type="file" accept="image/*" />
                  </div>
                  <textarea class="textarea out-pure" id="outPure" readonly placeholder="iVBORw0KGgoAAAANSUhEUg..."></textarea>
                  <div class="field-label lab-data">Data URL（可直接用于 img src）</div>
                  <textarea class="textarea out-data" id="outDataUrl" readonly placeholder="data:image/...;base64,..."></textarea>
                </div>
              </div>

              <!-- ② 解码 → 图片 -->
              <div class="tool-card">
                <div class="tool-card-title">
                  解码 → 图片
                  <span class="status" id="decodeStatus" style="margin-left:auto;flex:0 1 auto;text-align:right"></span>
                </div>
                <div class="tool-row">
                  <span class="field-label">输入类型</span>
                  <div class="seg" id="decodeType">
                    <label>
                      <input type="radio" name="decodeType" value="pure" checked />
                      <span>Base64 编码</span>
                    </label>
                    <label>
                      <input type="radio" name="decodeType" value="dataurl" />
                      <span>Data URL</span>
                    </label>
                  </div>
                </div>
                <div class="io-grid">
                  <div class="field-label" id="decodeInputLabel">Base64 编码（纯数据）</div>
                  <div class="field-label">预览</div>
                  <div class="io-box left">
                    <textarea class="textarea decode-input" id="decodeInput" placeholder="iVBORw0KGgoAAAANSUhEUg..."></textarea>
                  </div>
                  <div class="io-box right">
                    <div class="preview-wrap" id="decodePreviewWrap">
                      <button class="preview-dl" id="btnDecodeDownload" type="button" title="下载图片">
                        <img src="../icons/download.svg" alt="" />
                      </button>
                      <img class="preview" id="decodePreview" alt="预览" hidden />
                      <span class="hint" id="decodePreviewHint">输入内容后自动预览</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 二维码 -->
          <div class="panel" data-id="qrcode">
            <div class="qr-page">
              <div class="qr-left">
                <textarea class="textarea qr-text" id="qrText" placeholder="请输入文字"></textarea>
                <div class="qr-left-actions">
                  <span class="status" id="qrStatus"></span>
                  <button class="btn" type="button" id="btnGenQr">生成二维码</button>
                </div>
              </div>
              <div class="qr-right">
                <div class="qr-preview-card">
                  <div class="preview-wrap" id="qrPreviewWrap">
                    <button class="preview-dl" id="btnDlQr" type="button" title="下载 PNG">
                      <img src="../icons/download.svg" alt="" />
                    </button>
                    <canvas id="qrCanvas" width="300" height="300" hidden></canvas>
                    <span class="hint" id="qrHint">点击生成后显示二维码</span>
                  </div>
                  <div class="qr-summary" id="qrSummary">QR Code, 15%容错, 300x300px</div>
                </div>
                <div class="qr-settings">
                  <div class="qr-setting-row">
                    <label class="field-label" for="qrType">码制</label>
                    <select class="select" id="qrType">
                      <option value="qrcode" selected>QR Code</option>
                      <option value="pdf417">PDF417</option>
                      <option value="datamatrix">Data Matrix</option>
                    </select>
                  </div>
                  <div class="qr-setting-row">
                    <label class="field-label" for="qrLevel">容错率</label>
                    <select class="select" id="qrLevel">
                      <option value="L">7%</option>
                      <option value="M" selected>15%</option>
                      <option value="Q">25%</option>
                      <option value="H">30%</option>
                    </select>
                  </div>
                  <div class="qr-setting-row">
                    <label class="field-label" for="qrSizePreset">尺寸</label>
                    <select class="select" id="qrSizePreset">
                      <option value="300" selected>300x300px</option>
                      <option value="400">400x400px</option>
                      <option value="500">500x500px</option>
                      <option value="600">600x600px</option>
                      <option value="custom">自定义尺寸</option>
                    </select>
                  </div>
                  <div class="qr-setting-row is-hidden" id="qrCustomSizeRow">
                    <span class="field-label"></span>
                    <div class="qr-size-custom">
                      <input class="input" id="qrSizeCustom" type="number" min="64" max="2048" step="1" value="800" />
                      <span class="unit">px</span>
                    </div>
                  </div>
                  <div class="qr-setting-row">
                    <label class="field-label" for="qrVersion">码版本</label>
                    <select class="select" id="qrVersion"></select>
                  </div>
                  <div class="qr-setting-row">
                    <label class="field-label" for="qrMargin">码边距</label>
                    <select class="select" id="qrMargin">
                      <option value="1" selected>1个色块</option>
                      <option value="2">2个色块</option>
                      <option value="3">3个色块</option>
                      <option value="4">4个色块</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 正则 -->
          <div class="panel" data-id="regex">
            <div class="re-panel">
              <div class="field">
                <div class="re-head">
                  <div class="field-label">正则表达式</div>
                  <button class="btn-copy" type="button" id="btnCopyRegex" title="复制正则">
                    <img src="../icons/copy.svg" alt="" />
                    <span class="btn-copy-label">复制</span>
                  </button>
                </div>
                <div class="re-pattern-row">
                  <span class="re-slash">/</span>
                  <input class="input" id="rePattern" placeholder="输入正则表达式..." />
                  <span class="re-flags-suffix" id="reFlagsSuffix" aria-hidden="true">
                    <span class="slash">/</span><span class="flags">g</span>
                  </span>
                </div>
                <div class="re-flags">
                  <label class="check"><input type="checkbox" class="re-flag" data-flag="g" checked /> <span class="re-flag-key">g</span> 全局匹配</label>
                  <label class="check"><input type="checkbox" class="re-flag" data-flag="i" /> <span class="re-flag-key">i</span> 忽略大小写</label>
                  <label class="check"><input type="checkbox" class="re-flag" data-flag="m" /> <span class="re-flag-key">m</span> 多行模式</label>
                  <label class="check"><input type="checkbox" class="re-flag" data-flag="s" /> <span class="re-flag-key">s</span> 点号匹配换行</label>
                </div>
              </div>

              <div class="field" style="flex:1">
                <div class="field-label">测试字符串</div>
                <div class="re-editor">
                  <div class="re-linenums" id="reLineNums" aria-hidden="true">1</div>
                  <textarea class="textarea" id="reText" placeholder="输入或粘贴要测试的文本"></textarea>
                </div>
              </div>

              <div class="field">
                <div class="re-result-head">
                  <div class="field-label">匹配结果</div>
                  <span class="re-count" id="reCount">0个匹配</span>
                </div>
                <div class="re-result-box" id="reResultBox">
                  <div class="re-result-empty" id="reEmpty">暂无匹配结果</div>
                  <div class="re-highlight" id="reHighlight" hidden></div>
                </div>
              </div>

              <div class="field">
                <div class="field-label">匹配详情</div>
                <div class="re-detail-empty" id="reDetailEmpty">暂无匹配详情</div>
                <ul class="re-detail-list" id="reMatches" hidden></ul>
              </div>
            </div>
          </div>

        </div>
      </section>
    </div>
  </div>

  <script src="./vendor/qrcode.min.js"></script>
  <script src="./vendor/bwip-js.min.js"></script>
  <script>
    /* —— 窗口壳 —— */
    const win = document.getElementById("win");
    const menu = document.getElementById("menu");
    const mainTitle = document.getElementById("mainTitle");
    const panels = document.querySelectorAll(".panel");
    const items = menu.querySelectorAll(".menu-item");

    menu.addEventListener("click", (e) => {
      const btn = e.target.closest(".menu-item");
      if (!btn) return;
      const id = btn.dataset.id;
      const name = btn.querySelector("span")?.textContent.trim() || btn.textContent.trim();
      const icon = btn.dataset.icon || "";
      items.forEach((el) => el.classList.toggle("is-active", el === btn));
      panels.forEach((el) => el.classList.toggle("is-active", el.dataset.id === id));
      mainTitle.textContent = name;
      const mainIcon = document.getElementById("mainIcon");
      if (mainIcon && icon) mainIcon.src = icon;
      document.getElementById("mainContent").scrollTop = 0;
    });

    document.getElementById("btnMin").addEventListener("click", () => {
      win.style.visibility = "hidden";
      setTimeout(() => { win.style.visibility = "visible"; }, 600);
    });

    const btnFs = document.getElementById("btnFs");
    const fsIcon = document.getElementById("fsIcon");
    let fullscreen = false;
    btnFs.addEventListener("click", () => {
      fullscreen = !fullscreen;
      win.classList.toggle("is-fullscreen", fullscreen);
      fsIcon.src = fullscreen ? "../icons/maximize.svg" : "../icons/restore.svg";
      btnFs.title = fullscreen ? "退出全屏" : "全屏";
    });

    document.getElementById("btnClose").addEventListener("click", () => {
      win.style.opacity = "0";
      win.style.transition = "opacity 160ms ease";
      setTimeout(() => {
        win.remove();
        document.body.insertAdjacentHTML(
          "beforeend",
          '<p style="text-align:center;margin-top:40vh;color:#888">窗口已关闭（原型演示）</p>'
        );
      }, 160);
    });

    function setStatus(el, text, type) {
      el.textContent = text || "";
      el.classList.remove("ok", "err");
      if (type) el.classList.add(type);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        return ok;
      }
    }

    /* —— 图片 ↔ Base64 —— */
    const imgDrop = document.getElementById("imgDrop");
    const imgFile = document.getElementById("imgFile");
    const imgPreview = document.getElementById("imgPreview");
    const outPure = document.getElementById("outPure");
    const outDataUrl = document.getElementById("outDataUrl");
    const encodeStatus = document.getElementById("encodeStatus");
    const decodeInput = document.getElementById("decodeInput");
    const decodeInputLabel = document.getElementById("decodeInputLabel");
    const decodePreview = document.getElementById("decodePreview");
    const decodePreviewHint = document.getElementById("decodePreviewHint");
    const decodeStatus = document.getElementById("decodeStatus");
    const btnDecodeDownload = document.getElementById("btnDecodeDownload");
    let encodeMime = "image/png";
    let lastDecodeDataUrl = "";
    let decodeTimer = null;

    function fillEncodeOutputs(dataUrl) {
      outDataUrl.value = dataUrl;
      outPure.value = dataUrl.replace(/^data:[^;]+;base64,/, "");
    }

    function loadImageFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        setStatus(encodeStatus, "请选择图片文件", "err");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = String(reader.result || "");
        encodeMime = file.type || "image/png";
        imgDrop.querySelectorAll(".dz-hint, .dz-sub").forEach((el) => el.remove());
        imgPreview.src = dataUrl;
        imgPreview.hidden = false;
        fillEncodeOutputs(dataUrl);
        setStatus(
          encodeStatus,
          `已编码 ${file.name}（${Math.round(file.size / 1024)} KB）`,
          "ok"
        );
      };
      reader.onerror = () => setStatus(encodeStatus, "读取失败", "err");
      reader.readAsDataURL(file);
    }

    imgDrop.addEventListener("click", () => imgFile.click());
    imgFile.addEventListener("change", () => {
      if (imgFile.files?.[0]) loadImageFile(imgFile.files[0]);
    });
    imgDrop.addEventListener("dragover", (e) => {
      e.preventDefault();
      imgDrop.classList.add("is-drag");
    });
    imgDrop.addEventListener("dragleave", () => imgDrop.classList.remove("is-drag"));
    imgDrop.addEventListener("drop", (e) => {
      e.preventDefault();
      imgDrop.classList.remove("is-drag");
      const file = e.dataTransfer?.files?.[0];
      if (file) loadImageFile(file);
    });

    function takeImageFromClipboard(clipboardData) {
      if (!clipboardData) return null;
      const items = clipboardData.items;
      if (items) {
        for (const item of items) {
          if (item.type && item.type.startsWith("image/")) {
            return item.getAsFile();
          }
        }
      }
      const files = clipboardData.files;
      if (files?.length) {
        for (const file of files) {
          if (file.type.startsWith("image/")) return file;
        }
      }
      return null;
    }

    imgDrop.addEventListener("paste", (e) => {
      const file = takeImageFromClipboard(e.clipboardData);
      if (!file) return;
      e.preventDefault();
      loadImageFile(file);
    });

    // 焦点在上传区外时，当前面板为编码页也可 Ctrl+V 粘贴到上传区
    document.addEventListener("paste", (e) => {
      const panel = document.querySelector('.panel.is-active[data-id="img-base64"]');
      if (!panel) return;
      if (e.target && (e.target.closest("textarea") || e.target.closest("input"))) return;
      const file = takeImageFromClipboard(e.clipboardData);
      if (!file) return;
      e.preventDefault();
      loadImageFile(file);
      imgDrop.focus();
    });

    function getDecodeType() {
      return document.querySelector('input[name="decodeType"]:checked')?.value || "pure";
    }

    function updateDecodePlaceholder() {
      const type = getDecodeType();
      if (type === "dataurl") {
        decodeInputLabel.textContent = "Data URL";
        decodeInput.placeholder = "data:image/png;base64,iVBORw0KGgo...";
      } else {
        decodeInputLabel.textContent = "Base64 编码（纯数据）";
        decodeInput.placeholder = "iVBORw0KGgoAAAANSUhEUg...";
      }
      scheduleDecodePreview();
    }

    document.querySelectorAll('input[name="decodeType"]').forEach((el) => {
      el.addEventListener("change", updateDecodePlaceholder);
    });

    function toDataUrlFromDecodeInput() {
      const raw = decodeInput.value.trim();
      if (!raw) return "";
      const type = getDecodeType();
      const compact = raw.replace(/\s+/g, "");
      if (type === "dataurl") {
        if (!compact.startsWith("data:")) {
          throw new Error("不是有效的 Data URL（需以 data: 开头）");
        }
        return compact;
      }
      if (compact.startsWith("data:")) {
        throw new Error("当前为「Base64 编码」模式，请去掉 data: 前缀");
      }
      return `data:image/png;base64,${compact}`;
    }

    function showImage(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(dataUrl);
        img.onerror = () => reject(new Error("图片无效"));
        img.src = dataUrl;
      });
    }

    function clearDecodePreview() {
      lastDecodeDataUrl = "";
      decodePreview.hidden = true;
      decodePreview.removeAttribute("src");
      decodePreviewHint.hidden = false;
      btnDecodeDownload.classList.remove("is-visible");
    }

    async function decodeToPreview() {
      try {
        const dataUrl = toDataUrlFromDecodeInput();
        if (!dataUrl) {
          clearDecodePreview();
          setStatus(decodeStatus, "");
          return null;
        }
        await showImage(dataUrl);
        lastDecodeDataUrl = dataUrl;
        decodePreview.src = dataUrl;
        decodePreview.hidden = false;
        decodePreviewHint.hidden = true;
        btnDecodeDownload.classList.add("is-visible");
        const m = dataUrl.match(/^data:([^;]+);base64,/);
        if (m) encodeMime = m[1];
        setStatus(decodeStatus, "预览就绪", "ok");
        return dataUrl;
      } catch (err) {
        clearDecodePreview();
        setStatus(decodeStatus, err.message || "解码失败", "err");
        return null;
      }
    }

    function scheduleDecodePreview() {
      clearTimeout(decodeTimer);
      decodeTimer = setTimeout(() => {
        decodeToPreview();
      }, 280);
    }

    decodeInput.addEventListener("input", scheduleDecodePreview);
    updateDecodePlaceholder();

    btnDecodeDownload.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!lastDecodeDataUrl) return;
      const mime = (lastDecodeDataUrl.match(/^data:([^;]+);/) || [])[1] || encodeMime || "image/png";
      const ext = (mime.split("/")[1] || "png").replace("jpeg", "jpg");
      const a = document.createElement("a");
      a.href = lastDecodeDataUrl;
      a.download = `image-${Date.now()}.${ext}`;
      a.click();
      setStatus(decodeStatus, "已开始下载", "ok");
    });

    /* —— 二维码 —— */
    const qrText = document.getElementById("qrText");
    const qrType = document.getElementById("qrType");
    const qrLevel = document.getElementById("qrLevel");
    const qrSizePreset = document.getElementById("qrSizePreset");
    const qrSizeCustom = document.getElementById("qrSizeCustom");
    const qrCustomSizeRow = document.getElementById("qrCustomSizeRow");
    const qrVersion = document.getElementById("qrVersion");
    const qrMargin = document.getElementById("qrMargin");
    const qrCanvas = document.getElementById("qrCanvas");
    const qrStatus = document.getElementById("qrStatus");
    const qrHint = document.getElementById("qrHint");
    const qrSummary = document.getElementById("qrSummary");
    const btnGenQr = document.getElementById("btnGenQr");
    const btnDlQr = document.getElementById("btnDlQr");
    let qrReady = false;

    (function fillQrVersions() {
      for (let v = 1; v <= 40; v++) {
        const modules = 17 + 4 * v;
        const opt = document.createElement("option");
        opt.value = String(v);
        opt.textContent = `${v} (${modules}*${modules})`;
        if (v === 1) opt.selected = true;
        qrVersion.appendChild(opt);
      }
    })();

    const QR_LEVEL_PCT = { L: "7%", M: "15%", Q: "25%", H: "30%" };
    const QR_TYPE_LABEL = {
      qrcode: "QR Code",
      pdf417: "PDF417",
      datamatrix: "Data Matrix",
    };

    function getQrType() {
      return qrType.value;
    }

    function isQrCodeType() {
      return getQrType() === "qrcode";
    }

    function getQrPixelSize() {
      if (qrSizePreset.value === "custom") {
        const n = Number(qrSizeCustom.value);
        return Number.isFinite(n) ? Math.min(2048, Math.max(64, Math.round(n))) : 300;
      }
      return Number(qrSizePreset.value) || 300;
    }

    function updateQrCustomSizeRow() {
      const showCustom = qrSizePreset.value === "custom";
      qrCustomSizeRow.classList.toggle("is-hidden", !showCustom);
    }

    function updateQrSummary() {
      const typeLabel = QR_TYPE_LABEL[getQrType()] || "QR Code";
      const size = getQrPixelSize();
      if (isQrCodeType()) {
        const pct = QR_LEVEL_PCT[qrLevel.value] || "15%";
        qrSummary.textContent = `QR Code, ${pct}容错, ${size}x${size}px`;
      } else {
        qrSummary.textContent = `${typeLabel}, ${size}x${size}px`;
      }
    }

    function syncQrTypeUi() {
      const isQr = isQrCodeType();
      // 容错率、码版本：仅 QR Code
      qrLevel.disabled = !isQr;
      qrVersion.disabled = !isQr;
      updateQrCustomSizeRow();
      updateQrSummary();
      if (qrStatus.textContent.includes("暂不支持") || qrStatus.textContent.includes("暂无")) {
        setStatus(qrStatus, "");
      }
    }

    function setQrPreviewVisible(ok) {
      qrReady = !!ok;
      qrCanvas.hidden = !ok;
      qrCanvas.style.display = ok ? "block" : "none";
      if (qrHint) {
        qrHint.hidden = !!ok;
        qrHint.style.display = ok ? "none" : "flex";
      }
      btnDlQr.classList.toggle("is-visible", !!ok);
      if (ok) normalizeQrCanvasStyle();
    }

    function normalizeQrCanvasStyle() {
      // qrcode 库会把 style 写成真实像素，导致预览区撑破/变形，这里强制按比例适配
      qrCanvas.style.width = "auto";
      qrCanvas.style.height = "auto";
      qrCanvas.style.maxWidth = "100%";
      qrCanvas.style.maxHeight = "100%";
    }

    function fitBarcodeToCanvas(srcCanvas, size) {
      qrCanvas.width = size;
      qrCanvas.height = size;
      const ctx = qrCanvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);
      const scale = Math.min(size / srcCanvas.width, size / srcCanvas.height);
      const w = Math.max(1, Math.floor(srcCanvas.width * scale));
      const h = Math.max(1, Math.floor(srcCanvas.height * scale));
      const x = Math.floor((size - w) / 2);
      const y = Math.floor((size - h) / 2);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(srcCanvas, x, y, w, h);
      normalizeQrCanvasStyle();
    }

    function generateWithBwip(bcid, text, size, margin) {
      if (typeof bwipjs === "undefined" || typeof bwipjs.toCanvas !== "function") {
        throw new Error("条码库加载失败");
      }
      const tmp = document.createElement("canvas");
      const opts = {
        bcid,
        text,
        scale: 4,
        includetext: false,
        paddingwidth: margin,
        paddingheight: margin,
        backgroundcolor: "FFFFFF",
      };
      if (bcid === "pdf417") {
        opts.height = 10;
        opts.eclevel = 2;
      }
      bwipjs.toCanvas(tmp, opts);
      fitBarcodeToCanvas(tmp, size);
    }

    async function generateQr() {
      const text = qrText.value;
      if (!text.trim()) {
        setStatus(qrStatus, "请输入内容", "err");
        return;
      }
      const size = getQrPixelSize();
      const margin = Number(qrMargin.value) || 1;
      const type = getQrType();

      try {
        if (type === "qrcode") {
          const api = typeof QRCode !== "undefined" ? QRCode : null;
          if (!api || typeof api.toCanvas !== "function") {
            setStatus(qrStatus, "二维码库加载失败", "err");
            return;
          }
          await api.toCanvas(qrCanvas, text, {
            width: size,
            margin,
            errorCorrectionLevel: qrLevel.value || "M",
            version: Number(qrVersion.value) || 1,
            color: { dark: "#000000", light: "#ffffff" },
          });
          normalizeQrCanvasStyle();
        } else if (type === "pdf417") {
          generateWithBwip("pdf417", text, size, margin);
        } else if (type === "datamatrix") {
          generateWithBwip("datamatrix", text, size, margin);
        }
        setQrPreviewVisible(true);
        updateQrSummary();
        setStatus(qrStatus, "已生成", "ok");
      } catch (err) {
        setQrPreviewVisible(false);
        setStatus(qrStatus, "生成失败：" + (err?.message || err), "err");
      }
    }

    function maybeRegenQr() {
      updateQrCustomSizeRow();
      updateQrSummary();
      if (qrText.value.trim() && qrReady) generateQr();
    }

    qrType.addEventListener("change", () => {
      syncQrTypeUi();
      if (qrText.value.trim()) generateQr();
    });
    qrSizePreset.addEventListener("change", maybeRegenQr);
    qrSizeCustom.addEventListener("change", maybeRegenQr);
    qrLevel.addEventListener("change", maybeRegenQr);
    qrVersion.addEventListener("change", maybeRegenQr);
    qrMargin.addEventListener("change", maybeRegenQr);
    btnGenQr.addEventListener("click", generateQr);
    btnDlQr.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!qrReady) return;
      const a = document.createElement("a");
      a.href = qrCanvas.toDataURL("image/png");
      a.download = `barcode-${Date.now()}.png`;
      a.click();
      setStatus(qrStatus, "已开始下载", "ok");
    });
    syncQrTypeUi();

    /* —— 正则 —— */
    const rePattern = document.getElementById("rePattern");
    const reText = document.getElementById("reText");
    const reMatches = document.getElementById("reMatches");
    const reEmpty = document.getElementById("reEmpty");
    const reHighlight = document.getElementById("reHighlight");
    const reDetailEmpty = document.getElementById("reDetailEmpty");
    const reCount = document.getElementById("reCount");
    const reLineNums = document.getElementById("reLineNums");
    const flagChecks = document.querySelectorAll(".re-flag");

    function getReFlags() {
      const order = "gims";
      let flags = "";
      flagChecks.forEach((c) => {
        if (c.checked) flags += c.dataset.flag;
      });
      return [...new Set(flags.split(""))].sort((a, b) => order.indexOf(a) - order.indexOf(b)).join("");
    }

    function updateFlagsSuffix() {
      const flags = getReFlags();
      const el = document.getElementById("reFlagsSuffix");
      if (!el) return;
      el.innerHTML = `<span class="slash">/</span><span class="flags">${flags ? " " + flags : ""}</span>`;
    }

    function updateLineNums() {
      const lines = (reText.value.match(/\n/g) || []).length + 1;
      reLineNums.textContent = Array.from({ length: lines }, (_, i) => i + 1).join("\n");
    }

    function syncLineScroll() {
      reLineNums.scrollTop = reText.scrollTop;
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function clearResults() {
      reMatches.innerHTML = "";
      reHighlight.innerHTML = "";
      reHighlight.hidden = true;
      reEmpty.hidden = false;
      reMatches.hidden = true;
      reDetailEmpty.hidden = false;
      const err = document.getElementById("reErr");
      if (err) err.hidden = true;
    }

    function setMatchCount(count) {
      reCount.textContent = `${count}个匹配`;
      reCount.classList.toggle("has-match", count > 0);
    }

    function buildHighlight(text, matches) {
      if (!matches.length) return escapeHtml(text);
      let html = "";
      let last = 0;
      const sorted = [...matches].sort((a, b) => a.index - b.index);
      for (const m of sorted) {
        if (m.index < last) continue;
        html += escapeHtml(text.slice(last, m.index));
        html += `<span class="mk">【${escapeHtml(m.text)}】</span>`;
        last = m.index + m.text.length;
      }
      html += escapeHtml(text.slice(last));
      return html;
    }

    function runRegex() {
      updateFlagsSuffix();
      const pattern = rePattern.value;
      const flags = getReFlags();
      const text = reText.value;
      clearResults();

      if (!pattern) {
        setMatchCount(0);
        return;
      }

      let re;
      try {
        re = new RegExp(pattern, flags);
      } catch (err) {
        setMatchCount(0);
        reEmpty.hidden = true;
        let errEl = document.getElementById("reErr");
        if (!errEl) {
          errEl = document.createElement("div");
          errEl.id = "reErr";
          errEl.className = "re-result-err";
          document.getElementById("reResultBox").appendChild(errEl);
        }
        errEl.hidden = false;
        errEl.textContent = "正则无效：" + err.message;
        return;
      }

      const matches = [];
      if (re.global) {
        let m;
        let n = 0;
        const safety = 10000;
        while ((m = re.exec(text)) !== null) {
          matches.push({ index: m.index, text: m[0], groups: m.slice(1) });
          n += 1;
          if (m[0] === "") re.lastIndex += 1;
          if (n >= safety) break;
        }
      } else {
        const m = re.exec(text);
        if (m) matches.push({ index: m.index, text: m[0], groups: m.slice(1) });
      }

      setMatchCount(matches.length);

      if (!matches.length) {
        if (text) {
          reEmpty.hidden = true;
          reHighlight.hidden = false;
          reHighlight.innerHTML = escapeHtml(text);
        }
        return;
      }

      reEmpty.hidden = true;
      reHighlight.hidden = false;
      reHighlight.innerHTML = buildHighlight(text, matches);

      reDetailEmpty.hidden = true;
      reMatches.hidden = false;
      matches.forEach((m, i) => {
        const li = document.createElement("li");
        li.className = "re-detail-item";
        li.innerHTML =
          `<span class="idx">#${i + 1}</span>` +
          `<span class="val">"${escapeHtml(m.text)}"</span>` +
          `<span class="pos">位置: ${m.index}</span>`;
        reMatches.appendChild(li);
      });
    }

    document.getElementById("btnCopyRegex").addEventListener("click", async () => {
      const literal = `/${rePattern.value}/${getReFlags()}`;
      const ok = await copyText(literal);
      const btn = document.getElementById("btnCopyRegex");
      const label = btn.querySelector(".btn-copy-label");
      if (label) {
        const prev = label.textContent;
        label.textContent = ok ? "已复制" : "失败";
        setTimeout(() => { label.textContent = prev; }, 1200);
      }
    });

    flagChecks.forEach((c) => c.addEventListener("change", runRegex));
    rePattern.addEventListener("input", runRegex);
    reText.addEventListener("input", () => {
      updateLineNums();
      runRegex();
    });
    reText.addEventListener("scroll", syncLineScroll);
    updateLineNums();
    runRegex();
  </script>
</body>

</html>
