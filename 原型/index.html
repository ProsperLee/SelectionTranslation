<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便签原型</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            padding: 20px;
            font-family: "Microsoft YaHei UI", sans-serif;
        }

        button {
            cursor: pointer;
            border: none;
            background-color: transparent;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .note-container {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 200px;
            height: 300px;
            min-width: 160px;
            min-height: 120px;
            background-color: #F0B6F0;
            box-shadow: 0 0 2px 1px rgba(0, 0, 0, .2);
            overflow: hidden;
        }

        .note-header {
            width: 100%;
            height: 32px;
            flex-shrink: 0;
            background-color: #EFC1EF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
        }

        .left-group,
        .right-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* 与应用 HEADER_BTN_SIZE / ICON_SIZE 一致：按钮 18px，图标 12px */
        .icon-btn {
            width: 18px;
            height: 18px;
            border-radius: 3px;
        }

        .icon-btn:hover {
            background-color: rgba(0, 0, 0, 0.08);
        }

        .icon-btn:active {
            background-color: rgba(0, 0, 0, 0.14);
        }

        .icon-btn img,
        .icon-btn svg {
            width: 12px;
            height: 12px;
            display: block;
            pointer-events: none;
        }

        .icon-btn img {
            opacity: 0.55;
        }

        .icon-btn:hover img {
            opacity: 0.75;
        }

        .color-swatch {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.2);
            background: #F0B6F0;
            box-sizing: border-box;
        }

        .note-content {
            padding: 10px;
            flex: 1;
            min-height: 0;
        }

        textarea {
            resize: none;
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
            font: inherit;
            color: #333;
            /* Firefox */
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.28) transparent;
        }

        /* 细滚动条，贴近应用内 6px 样式；浅色便签用半透明深色滑块 */
        textarea::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        textarea::-webkit-scrollbar-track {
            background: transparent;
            margin: 4px 0;
        }

        textarea::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.22);
            border-radius: 999px;
            border: 1px solid transparent;
            background-clip: padding-box;
            min-height: 24px;
        }

        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.36);
            border: 1px solid transparent;
            background-clip: padding-box;
        }

        textarea::-webkit-scrollbar-thumb:active {
            background: #088fff;
            border: 1px solid transparent;
            background-clip: padding-box;
        }

        textarea::-webkit-scrollbar-corner {
            background: transparent;
        }

        textarea::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0;
        }

        /* 右下角尺寸调节，风格贴近 ResizeHandleWidget */
        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 12px;
            height: 12px;
            cursor: nwse-resize;
            z-index: 2;
        }

        .resize-handle::before,
        .resize-handle::after,
        .resize-handle span {
            content: "";
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: #666;
            right: 2px;
            bottom: 2px;
        }

        .resize-handle::after {
            right: 5px;
            bottom: 2px;
        }

        .resize-handle span {
            right: 2px;
            bottom: 5px;
        }

        .resize-handle:active::before,
        .resize-handle:active::after,
        .resize-handle:active span {
            background: #088fff;
        }
    </style>
</head>

<body>
    <div class="note-container" id="note">
        <header class="note-header" id="noteHeader">
            <div class="left-group">
                <button class="icon-btn" type="button" title="置顶" aria-label="置顶">
                    <img src="../icons/pin.svg" alt="">
                </button>
                <button class="icon-btn" type="button" title="新增" aria-label="新增" id="btnAdd">
                    <!-- 无现成加号图标，用与项目同尺寸的简洁 SVG -->
                    <svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M6 2v8M2 6h8" stroke="#000" stroke-width="1.25" stroke-linecap="round" fill="none"
                            opacity="0.55" />
                    </svg>
                </button>
                <button class="icon-btn" type="button" title="颜色" aria-label="颜色" id="btnColor">
                    <span class="color-swatch" id="colorSwatch"></span>
                </button>
            </div>
            <div class="right-group">
                <button class="icon-btn" type="button" title="关闭" aria-label="关闭">
                    <img src="../icons/close.svg" alt="">
                </button>
            </div>
        </header>
        <div class="note-content">
            <textarea placeholder="记点什么…"></textarea>
        </div>
        <div class="resize-handle" id="resizeHandle" title="拖动调整大小"><span></span></div>
    </div>

    <script>
        const LIGHT_COLORS = [
            { bg: "#F0B6F0", header: "#EFC1EF" },
            { bg: "#FFE4A8", header: "#FFE9B8" },
            { bg: "#B8E0D2", header: "#C5E6DB" },
            { bg: "#C5D4F0", header: "#D0DCF4" },
            { bg: "#F5C6C6", header: "#F7D1D1" },
            { bg: "#D4F0C5", header: "#DCF4D0" },
            { bg: "#F0D4B8", header: "#F4DCC5" },
            { bg: "#E0D4F0", header: "#E6DCF4" },
            { bg: "#C5F0E8", header: "#D0F4ED" },
            { bg: "#F0E8B8", header: "#F4EDC5" },
            { bg: "#D8E8F5", header: "#E0EDF7" },
            { bg: "#F5D8E8", header: "#F7E0ED" },
        ];

        const note = document.getElementById("note");
        const noteHeader = document.getElementById("noteHeader");
        const colorSwatch = document.getElementById("colorSwatch");
        const btnColor = document.getElementById("btnColor");
        const resizeHandle = document.getElementById("resizeHandle");

        let colorIndex = 0;

        function applyColor(pair) {
            note.style.backgroundColor = pair.bg;
            noteHeader.style.backgroundColor = pair.header;
            colorSwatch.style.background = pair.bg;
        }

        btnColor.addEventListener("click", () => {
            let next;
            do {
                next = Math.floor(Math.random() * LIGHT_COLORS.length);
            } while (next === colorIndex && LIGHT_COLORS.length > 1);
            colorIndex = next;
            applyColor(LIGHT_COLORS[colorIndex]);
        });

        // 右下角拖拽缩放
        let resizing = false;
        let startX = 0;
        let startY = 0;
        let startW = 0;
        let startH = 0;

        resizeHandle.addEventListener("mousedown", (e) => {
            e.preventDefault();
            resizing = true;
            startX = e.clientX;
            startY = e.clientY;
            startW = note.offsetWidth;
            startH = note.offsetHeight;
            document.body.style.userSelect = "none";
        });

        window.addEventListener("mousemove", (e) => {
            if (!resizing) return;
            const nextW = Math.max(160, startW + (e.clientX - startX));
            const nextH = Math.max(120, startH + (e.clientY - startY));
            note.style.width = nextW + "px";
            note.style.height = nextH + "px";
        });

        window.addEventListener("mouseup", () => {
            if (!resizing) return;
            resizing = false;
            document.body.style.userSelect = "";
        });
    </script>
</body>

</html>
